<g stroke="#fff3b0" stroke-width="3" stroke-linecap="round"><path d="M70 40 L150 136"/><path d="M100 40 L170 136"/></g>
<g fill="none" stroke="#ff8a3d" stroke-width="2.5" stroke-linecap="round" opacity=".85"><path d="M140 112 q6 -8 0 -16 q-6 -8 0 -16"/><path d="M160 112 q6 -8 0 -16 q-6 -8 0 -16"/><path d="M180 112 q6 -8 0 -16 q-6 -8 0 -16"/></g>
