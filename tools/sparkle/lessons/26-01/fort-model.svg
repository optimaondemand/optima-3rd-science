<path d="M20 70 H300 M20 90 H300 M20 110 H300 M20 130 H300"/>
<path d="M60 50 V70 M110 50 V70 M160 50 V70 M210 50 V70 M260 50 V70 M85 70 V90 M135 70 V90 M185 70 V90 M235 70 V90 M285 70 V90 M60 90 V110 M110 90 V110 M160 90 V110 M210 90 V110 M260 90 V110 M85 110 V130 M135 110 V130 M185 110 V130 M235 110 V130 M285 110 V130 M60 130 V150 M110 130 V150 M160 130 V150 M210 130 V150 M260 130 V150"/>
</g>
<rect x="20" y="50" width="280" height="100" fill="url(#fm-shells)" opacity=".2"/>
<path d="M20 50 V40 H40 V50 M70 50 V40 H90 V50 M120 50 V40 H140 V50 M170 50 V40 H190 V50 M220 50 V40 H240 V50 M270 50 V40 H290 V50" fill="url(#fm-wall)" stroke="#6f6858"/>
<g transform="translate(150 100)"><circle r="5" fill="#2f2f33"/><circle r="9" fill="none" stroke="#5d5545" stroke-width="1.5" stroke-dasharray="2 2"/></g>
</g>
</svg>
