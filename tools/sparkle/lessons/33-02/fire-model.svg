<g><use href="#fm-young" transform="translate(14 150)"/><use href="#fm-young" transform="translate(38 162) scale(1.2)"/><use href="#fm-young" transform="translate(62 152)"/><use href="#fm-young" transform="translate(100 164) scale(1.25)"/><use href="#fm-young" transform="translate(126 154)"/><use href="#fm-young" transform="translate(164 166) scale(1.2)"/><use href="#fm-young" transform="translate(188 152)"/><use href="#fm-young" transform="translate(226 164) scale(1.25)"/><use href="#fm-young" transform="translate(250 152)"/><use href="#fm-young" transform="translate(286 164) scale(1.2)"/><use href="#fm-young" transform="translate(308 152)"/></g>
