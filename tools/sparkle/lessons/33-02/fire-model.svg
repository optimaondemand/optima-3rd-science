<g id="fm-young"><rect x="-1" y="-20" width="2" height="20" fill="#7a5532"/><path d="M0 -26 L-6 -14 L-3 -14 L-8 -4 L8 -4 L3 -14 L6 -14 Z" fill="url(#fm-needle)"/></g>
<g id="fm-hills"><path d="M0 92 L40 60 L78 84 L122 46 L170 82 L214 54 L262 86 L300 64 L320 74 V120 H0 Z" fill="url(#fm-mtn)"/><path d="M122 46 l-8 7 l6 -1 l4 4 l4 -5 l6 2 Z M214 54 l-7 6 l6 0 l4 3 l3 -5 Z" fill="#eef3f7"/></g>
