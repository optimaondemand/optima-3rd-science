<svg viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A model of a lodgepole pine forest: tall green pines with closed cones, then a fire burns through, then black trunks stand on gray ash while the heat-opened cones drop seeds, then many small green pines grow up between the old trunks">
<defs>
<linearGradient id="fm-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fb0d8"/><stop offset="1" stop-color="#e6f0f7"/></linearGradient>
<linearGradient id="fm-smoke" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b5a52"/><stop offset=".55" stop-color="#c8743e"/><stop offset="1" stop-color="#f2b25c"/></linearGradient>
<linearGradient id="fm-haze" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9b4bd"/><stop offset="1" stop-color="#e3e1dc"/></linearGradient>
<linearGradient id="fm-mtn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8d9bab"/><stop offset="1" stop-color="#6f7f8f"/></linearGradient>
<linearGradient id="fm-grass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fb36a"/><stop offset="1" stop-color="#6f8743"/></linearGradient>
<linearGradient id="fm-ash" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7c7570"/><stop offset="1" stop-color="#3f3a37"/></linearGradient>
<linearGradient id="fm-trunk" x1="0" x2="1"><stop offset="0" stop-color="#6e4a2e"/><stop offset=".5" stop-color="#9a6d46"/><stop offset="1" stop-color="#5a3b24"/></linearGradient>
<linearGradient id="fm-char" x1="0" x2="1"><stop offset="0" stop-color="#1c1714"/><stop offset=".5" stop-color="#3b322c"/><stop offset="1" stop-color="#151110"/></linearGradient>
<linearGradient id="fm-flame" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffe27a"/><stop offset=".45" stop-color="#ff9a2e"/><stop offset="1" stop-color="#d9371b" stop-opacity=".85"/></linearGradient>
<linearGradient id="fm-needle" x1="0" x2="1"><stop offset="0" stop-color="#2f5a33"/><stop offset=".5" stop-color="#4f8a4a"/><stop offset="1" stop-color="#28492b"/></linearGradient>
<g id="fm-pine"><rect x="-2" y="-62" width="4" height="62" fill="url(#fm-trunk)"/><path d="M0 -70 L-9 -50 L-5 -50 L-12 -32 L-6 -32 L-14 -14 L14 -14 L6 -32 L12 -32 L5 -50 L9 -50 Z" fill="url(#fm-needle)"/><ellipse cx="5" cy="-40" rx="2" ry="3" fill="#7a5532"/><ellipse cx="-5" cy="-26" rx="2" ry="3" fill="#7a5532"/></g>
<g id="fm-snag"><path d="M-2.2 0 L-1.6 -60 L0 -66 L1.6 -58 L2.2 0 Z" fill="url(#fm-char)"/><path d="M-1 -40 L-7 -46 M1 -30 L6 -35" stroke="#241d19" stroke-width="1.4" stroke-linecap="round"/></g>
<g id="fm-cone"><ellipse rx="3" ry="4.2" fill="#8a5d34" stroke="#4d321b" stroke-width=".6"/><path d="M-3 -1 l-2.6 -1.4 M3 -1 l2.6 -1.4 M-3 1.5 l-2.6 .6 M3 1.5 l2.6 .6" stroke="#5b3b20" stroke-width="1"/></g>
<g id="fm-seed"><ellipse rx="1.3" ry="1" fill="#4d321b"/><path d="M1 0 q5 -3 8 -1 q-3 2 -8 1" fill="#c9a676" opacity=".9"/></g>
