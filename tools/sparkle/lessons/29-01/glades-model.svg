<svg viewBox="0 30 320 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A model of an Everglades marsh through one year: in the wet season, rain falls and water covers the sawgrass; in the dry season, the water shrinks until only the alligator's pond holds water and fish crowd into it; then wood storks feed there and nest on the tree island">
