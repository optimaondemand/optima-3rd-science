<svg viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A model of a lightning strike: a storm cloud builds up electric charge; a bolt of lightning hits the ground; the flash lights up the sky and heats the air; thunder rolls out as sound waves toward a house">
<defs>
<linearGradient id="bm-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a3442"/><stop offset="1" stop-color="#55606c"/></linearGradient>
<linearGradient id="bm-flash" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfd9f2"/><stop offset="1" stop-color="#8e9ab0"/></linearGradient>
<linearGradient id="bm-ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f5a33"/><stop offset="1" stop-color="#26381f"/></linearGradient>
<radialGradient id="bm-cloud" cx=".5" cy=".4" r=".6"><stop offset="0" stop-color="#9aa3ad"/><stop offset="1" stop-color="#4b535c"/></radialGradient>
<radialGradient id="bm-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffffff" stop-opacity=".95"/><stop offset=".4" stop-color="#bcd4ff" stop-opacity=".6"/><stop offset="1" stop-color="#bcd4ff" stop-opacity="0"/></radialGradient>
<radialGradient id="bm-heat" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffd27a" stop-opacity=".9"/><stop offset="1" stop-color="#ff7a2e" stop-opacity="0"/></radialGradient>
<linearGradient id="bm-house" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9dcc2"/><stop offset="1" stop-color="#c7b48f"/></linearGradient>
</defs>
<g class="s1">
<rect width="320" height="180" fill="url(#bm-sky)"/>
<g fill="url(#bm-cloud)"><ellipse cx="110" cy="40" rx="70" ry="26"/><ellipse cx="160" cy="30" rx="60" ry="28"/><ellipse cx="200" cy="44" rx="56" ry="22"/></g>
<g font-family="Arial,sans-serif" font-weight="bold" font-size="12"><g fill="#ffe08a"><text x="128" y="28">+</text><text x="168" y="22">+</text><text x="200" y="32">+</text></g><g fill="#9fd3ff"><text x="104" y="58">−</text><text x="146" y="60">−</text><text x="190" y="60">−</text></g></g>
<rect x="0" y="150" width="320" height="30" fill="url(#bm-ground)"/>
