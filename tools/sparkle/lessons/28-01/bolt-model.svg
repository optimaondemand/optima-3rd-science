</g>
<g class="s2">
<rect width="320" height="180" fill="url(#bm-sky)"/>
<g fill="url(#bm-cloud)"><ellipse cx="110" cy="40" rx="70" ry="26"/><ellipse cx="160" cy="30" rx="60" ry="28"/><ellipse cx="200" cy="44" rx="56" ry="22"/></g>
<path d="M150 60 L138 88 L152 90 L136 122 L150 124 L132 152" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
<path d="M150 60 L138 88 L152 90 L136 122 L150 124 L132 152" fill="none" stroke="#bcd4ff" stroke-width="9" stroke-linejoin="round" opacity=".35"/>
<rect x="0" y="150" width="320" height="30" fill="url(#bm-ground)"/>
<g transform="translate(262 128)"><path d="M0 22 V8 L14 -4 L28 8 V22 Z" fill="url(#bm-house)" stroke="#7a6a4e" stroke-width="1.5"/><rect x="10" y="12" width="8" height="10" fill="#6d5a3c"/></g>
</g>
<g class="s3">
<rect width="320" height="180" fill="url(#bm-flash)"/>
<circle cx="144" cy="106" r="70" fill="url(#bm-glow)"/>
<g fill="#aab3bd"><ellipse cx="110" cy="40" rx="70" ry="26"/><ellipse cx="160" cy="30" rx="60" ry="28"/><ellipse cx="200" cy="44" rx="56" ry="22"/></g>
<ellipse cx="142" cy="106" rx="18" ry="50" fill="url(#bm-heat)"/>
<path d="M150 60 L138 88 L152 90 L136 122 L150 124 L132 152" fill="none" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"/>
<rect x="0" y="150" width="320" height="30" fill="#5d7a4c"/>
<g transform="translate(262 128)"><path d="M0 22 V8 L14 -4 L28 8 V22 Z" fill="#f4ead4" stroke="#7a6a4e" stroke-width="1.5"/><rect x="10" y="12" width="8" height="10" fill="#6d5a3c"/></g>
</g>
