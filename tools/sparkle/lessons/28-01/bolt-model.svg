<g fill="none" stroke="#ffe7a3" stroke-linecap="round" opacity=".85"><path d="M168 82 a40 40 0 0 1 0 60" stroke-width="3"/><path d="M190 70 a62 62 0 0 1 0 84" stroke-width="3" opacity=".75"/><path d="M212 60 a84 84 0 0 1 0 104" stroke-width="3" opacity=".55"/><path d="M234 52 a106 106 0 0 1 0 120" stroke-width="3" opacity=".4"/></g>
<rect x="0" y="150" width="320" height="30" fill="url(#bm-ground)"/>
<g transform="translate(262 128)"><path d="M0 22 V8 L14 -4 L28 8 V22 Z" fill="url(#bm-house)" stroke="#7a6a4e" stroke-width="1.5"/><rect x="10" y="12" width="8" height="10" fill="#6d5a3c"/></g>
