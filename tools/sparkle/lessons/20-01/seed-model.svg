<svg viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A model of a bean seed planted upside down: its root turns down and its stem turns up">
<defs>
<linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9cc9e8"/><stop offset="1" stop-color="#e5f1f6"/></linearGradient>
<linearGradient id="gSoil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a5a3a"/><stop offset=".5" stop-color="#5c4229"/><stop offset="1" stop-color="#3b2a1a"/></linearGradient>
<radialGradient id="gSeed" cx=".35" cy=".35" r=".75"><stop offset="0" stop-color="#e7b49a"/><stop offset=".6" stop-color="#b8664a"/><stop offset="1" stop-color="#7d3a26"/></radialGradient>
<radialGradient id="gLeafB" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#8fd06a"/><stop offset=".7" stop-color="#4f9a37"/><stop offset="1" stop-color="#2f6a22"/></radialGradient>
<radialGradient id="gSun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff7c2"/><stop offset=".6" stop-color="#ffd43b"/><stop offset="1" stop-color="#ffd43b" stop-opacity="0"/></radialGradient>
</defs>
<rect width="320" height="70" fill="url(#gSky)"/><circle cx="270" cy="22" r="22" fill="url(#gSun)"/>
<rect y="70" width="320" height="110" fill="url(#gSoil)"/>
<path d="M0 70 Q80 67 160 70 T320 70" fill="none" stroke="#3b2a1a" stroke-width="1.5"/>
<circle cx="20" cy="90" r="1" fill="#2a1d12" opacity=".5"/><circle cx="55" cy="140" r="1" fill="#2a1d12" opacity=".5"/><circle cx="90" cy="110" r="1" fill="#2a1d12" opacity=".5"/><circle cx="210" cy="95" r="1" fill="#2a1d12" opacity=".5"/><circle cx="250" cy="150" r="1" fill="#2a1d12" opacity=".5"/><circle cx="290" cy="120" r="1" fill="#2a1d12" opacity=".5"/><circle cx="130" cy="160" r="1" fill="#2a1d12" opacity=".5"/><circle cx="30" cy="165" r="1" fill="#2a1d12" opacity=".5"/><circle cx="300" cy="85" r="1" fill="#2a1d12" opacity=".5"/>
<text x="10" y="84" font-size="8" font-family="sans-serif" font-weight="700" fill="#f3e6cf">⬇ gravity pulls down</text>
<g><ellipse cx="160" cy="112" rx="15" ry="10" fill="url(#gSeed)"/><path d="M152 108 q8 -5 16 0" stroke="#5a2a18" stroke-width="1.5" fill="none"/></g><g class="s1"><text x="160" y="58" text-anchor="middle" font-size="9" font-family="sans-serif" font-weight="700" fill="#1f3b5a">Seed planted upside down</text><path d="M160 103 l0 -4" stroke="#fff3c8" stroke-width="2"/></g><g class="s2" style="opacity:0"><path d="M160 102 C160 92 172 90 174 100 C176 112 172 128 172 140" stroke="#f3ecd2" stroke-width="3.2" fill="none" stroke-linecap="round"/><text x="160" y="58" text-anchor="middle" font-size="9" font-family="sans-serif" font-weight="700" fill="#1f3b5a">The root comes out, then turns DOWN</text><path d="M186 120 l0 16 m-4 -5 l4 5 l4 -5" stroke="#ffe08a" stroke-width="2" fill="none"/></g><g class="s3" style="opacity:0"><path d="M160 102 C160 92 172 90 174 100 C176 115 172 135 172 158" stroke="#f3ecd2" stroke-width="3.2" fill="none" stroke-linecap="round"/><path d="M173 128 l-12 10 M174 144 l12 8 M172 116 l10 6" stroke="#e8dfc0" stroke-width="1.6"/><path d="M158 104 C150 96 146 88 150 80 C152 76 156 74 158 78" stroke="#a9c96a" stroke-width="3.4" fill="none" stroke-linecap="round"/><text x="160" y="58" text-anchor="middle" font-size="9" font-family="sans-serif" font-weight="700" fill="#1f3b5a">The stem bends into a hook and pushes UP</text></g><g class="s4" style="opacity:0"><path d="M160 102 C160 92 172 90 174 100 C176 115 172 135 172 158" stroke="#f3ecd2" stroke-width="3.2" fill="none" stroke-linecap="round"/><path d="M173 128 l-12 10 M174 144 l12 8 M172 116 l10 6" stroke="#e8dfc0" stroke-width="1.6"/><path d="M158 104 C150 96 146 86 150 74 C152 64 154 54 154 44" stroke="#5f9e3e" stroke-width="3.8" fill="none" stroke-linecap="round"/><ellipse cx="141" cy="42" rx="13" ry="6" fill="url(#gLeafB)" transform="rotate(-20 141 42)"/><ellipse cx="167" cy="40" rx="13" ry="6" fill="url(#gLeafB)" transform="rotate(20 167 40)"/><text x="235" y="58" text-anchor="middle" font-size="9" font-family="sans-serif" font-weight="700" fill="#1f3b5a">Leaves open in the light</text></g></svg>