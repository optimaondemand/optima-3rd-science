<text x="96" y="100" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#8a2a12">?</text>
<rect x="84" y="38" width="152" height="16" rx="4" fill="#fff" opacity=".92"/><text x="160" y="50" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#8a2a12">TEST: TOO SMALL AND DARK</text>
