<svg viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A model of engineers designing a panther crossing: panthers are hit crossing a highway; engineers sketch a tunnel under the road; a test shows a panther will not enter a small, dark pipe; the improved design is a wide, bright underpass with fences and plants, and the panther walks through">
<defs>
