<g id="um-cat"><path d="M-16 0 Q-14 -10 0 -10 Q12 -10 14 -4 L20 -8 Q24 -6 22 -2 L16 0 Z" fill="#c49a62"/><path d="M-16 -4 Q-26 -6 -30 -14" stroke="#c49a62" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="-12" y="-2" width="3" height="8" fill="#a77f4c"/><rect x="-6" y="-2" width="3" height="8" fill="#a77f4c"/><rect x="6" y="-2" width="3" height="8" fill="#a77f4c"/><rect x="11" y="-2" width="3" height="8" fill="#a77f4c"/><circle cx="20" cy="-5" r="1" fill="#222"/></g>
<g id="um-car"><rect x="-16" y="-9" width="32" height="9" rx="3" fill="#d2433a"/><path d="M-9 -9 L-5 -15 H6 L10 -9 Z" fill="#d2433a"/><circle cx="-9" cy="1" r="3" fill="#222"/><circle cx="9" cy="1" r="3" fill="#222"/></g>
<g id="um-ground"><rect y="128" width="320" height="52" fill="#6f9a4c"/><path d="M80 128 L118 72 H202 L240 128 Z" fill="#9b8462"/><rect x="112" y="66" width="96" height="7" fill="#4a4a4a"/><path d="M118 69.5 H202" stroke="#f2d24a" stroke-width="1" stroke-dasharray="6 5"/></g>
<g id="um-tag"><rect x="0" y="0" width="1" height="1" fill="none"/></g>
</defs>
<g class="s1">
<rect width="320" height="180" fill="url(#um-dusk)"/>
<use href="#um-ground"/>
