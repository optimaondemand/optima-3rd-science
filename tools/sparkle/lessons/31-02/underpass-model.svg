</g>
<g class="s2">
<rect width="320" height="180" fill="#1f4f8a"/>
<g stroke="#ffffff" stroke-opacity=".12" stroke-width="1"><path d="M0 20 H320 M0 40 H320 M0 60 H320 M0 80 H320 M0 100 H320 M0 120 H320 M0 140 H320 M0 160 H320 M40 0 V180 M80 0 V180 M120 0 V180 M160 0 V180 M200 0 V180 M240 0 V180 M280 0 V180"/></g>
<g fill="none" stroke="#fff" stroke-width="1.6"><path d="M40 128 H280"/><path d="M80 128 L118 72 H202 L240 128"/><path d="M128 128 V100 Q160 86 192 100 V128" stroke-dasharray="5 3"/></g>
