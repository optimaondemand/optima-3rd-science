<svg viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A model of wolves returning to Yellowstone: elk crowd by the river and eat the young willows; wolves return and hunt elk; elk move around more and spend less time in one spot by the river; some streamside willows grow taller">
<defs>
<linearGradient id="wm-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fc3dd"/><stop offset="1" stop-color="#e8f1f7"/></linearGradient>
<g id="wm-elk"><g transform="scale(1.45)"><ellipse cx="0" cy="0" rx="9" ry="5" fill="#8a5a33"/><rect x="-7" y="3" width="2" height="7" fill="#6b4425"/><rect x="5" y="3" width="2" height="7" fill="#6b4425"/><path d="M8 -2 L13 -8 L16 -7 L12 -1 Z" fill="#8a5a33"/><path d="M13 -8 l-2 -6 M13 -8 l3 -5" stroke="#5a3a1f" stroke-width="1"/></g></g>
<g id="wm-wolf"><g transform="scale(1.45)"><path d="M-10 0 Q-8 -6 2 -6 Q9 -6 10 -3 L15 -6 Q17 -4 15 -1 L10 0 Z" fill="#6f6f74"/><path d="M-10 -2 Q-16 0 -18 -4" stroke="#6f6f74" stroke-width="2.4" fill="none" stroke-linecap="round"/><rect x="-8" y="-1" width="2" height="7" fill="#58585c"/><rect x="-3" y="-1" width="2" height="7" fill="#58585c"/><rect x="4" y="-1" width="2" height="7" fill="#58585c"/><rect x="8" y="-1" width="2" height="7" fill="#58585c"/></g></g>
<g id="wm-short" stroke="#7a3f28" stroke-width="1.6" stroke-linecap="round" fill="none"><path d="M0 0 l-2 -5 M0 0 l1 -6 M0 0 l3 -4"/></g>
<g id="wm-tall" stroke="#8a4a2a" stroke-width="2" stroke-linecap="round" fill="none"><path d="M0 0 l-4 -18 M0 0 l0 -22 M0 0 l4 -17 M0 0 l-7 -12 M0 0 l7 -13"/></g>
<g id="wm-land">
<path d="M0 70 L60 40 L110 62 L170 34 L230 58 L290 36 L320 50 V180 H0 Z" fill="#dfe6ea"/>
<g fill="#2f5a3c"><path d="M30 70 l6 -16 l6 16 Z"/><path d="M250 64 l6 -16 l6 16 Z"/><path d="M268 66 l5 -14 l5 14 Z"/></g>
<rect y="74" width="320" height="106" fill="#c9d2a8"/>
<path d="M0 118 Q80 108 160 120 T320 116 V132 Q240 136 160 134 T0 130 Z" fill="#5d8fb0"/>
</g>
</defs>
<g class="s1">
<rect width="320" height="180" fill="url(#wm-sky)"/><use href="#wm-land"/>
<g><use href="#wm-short" transform="translate(70 116)"/><use href="#wm-short" transform="translate(110 114)"/><use href="#wm-short" transform="translate(200 116)"/><use href="#wm-short" transform="translate(240 115)"/></g>
<use href="#wm-elk" transform="translate(84 106)"/><use href="#wm-elk" transform="translate(126 104)"/><use href="#wm-elk" transform="translate(186 106)"/><use href="#wm-elk" transform="translate(222 104)"/><use href="#wm-elk" transform="translate(150 98) scale(.9)"/>
<rect x="88" y="78" width="144" height="15" rx="4" fill="#fff" opacity=".9"/><text x="160" y="89" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#5a3a1f">ELK EAT THE YOUNG WILLOWS</text>
</g>
<g class="s2">
<rect width="320" height="180" fill="url(#wm-sky)"/><use href="#wm-land"/>
<g><use href="#wm-short" transform="translate(70 116)"/><use href="#wm-short" transform="translate(110 114)"/><use href="#wm-short" transform="translate(200 116)"/><use href="#wm-short" transform="translate(240 115)"/></g>
<use href="#wm-wolf" transform="translate(52 98)"/><use href="#wm-wolf" transform="translate(30 104) scale(.9)"/><use href="#wm-wolf" transform="translate(70 106) scale(.9)"/>
<use href="#wm-elk" transform="translate(150 102)"/><use href="#wm-elk" transform="translate(186 98)"/><use href="#wm-elk" transform="translate(222 104)"/>
<rect x="96" y="78" width="128" height="15" rx="4" fill="#fff" opacity=".9"/><text x="160" y="89" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#444">1995: WOLVES RETURN</text>
</g>
<g class="s3">
<rect width="320" height="180" fill="url(#wm-sky)"/><use href="#wm-land"/>
<g><use href="#wm-short" transform="translate(70 116)"/><use href="#wm-short" transform="translate(110 114)"/><use href="#wm-short" transform="translate(200 116)"/><use href="#wm-short" transform="translate(240 115)"/></g>
<use href="#wm-elk" transform="translate(120 84) scale(.85)"/><use href="#wm-elk" transform="translate(212 86) scale(.85)"/><use href="#wm-elk" transform="translate(262 92) scale(.85)"/>
<use href="#wm-wolf" transform="translate(40 100) scale(.85)"/>
<rect x="90" y="54" width="140" height="15" rx="4" fill="#fff" opacity=".9"/><text x="160" y="65" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#5a3a1f">ELK KEEP MOVING</text>
</g>
<g class="s4">
<rect width="320" height="180" fill="url(#wm-sky)"/><use href="#wm-land"/>
<g><use href="#wm-tall" transform="translate(70 118)"/><use href="#wm-tall" transform="translate(110 116)"/><use href="#wm-short" transform="translate(150 116)"/><use href="#wm-tall" transform="translate(200 118)"/><use href="#wm-short" transform="translate(240 115)"/></g>
<use href="#wm-elk" transform="translate(262 92) scale(.85)"/>
<rect x="74" y="78" width="172" height="15" rx="4" fill="#fff" opacity=".9"/><text x="160" y="89" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#2e6b1f">SOME WILLOWS GROW TALLER</text>
</g>
</svg>
