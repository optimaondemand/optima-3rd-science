<svg viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A model of Apalachicola Bay: in dry years the river carries less fresh water to the bay, the bay gets saltier, oyster-eating snails move onto the reef, and the oyster reef shrinks while the oyster boats stay tied up">
<defs>
<linearGradient id="om-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fb9d6"/><stop offset="1" stop-color="#e9f1f6"/></linearGradient>
<linearGradient id="om-bayF" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a8f74"/><stop offset="1" stop-color="#4f6a5c"/></linearGradient>
<linearGradient id="om-bayS" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f9cab"/><stop offset="1" stop-color="#2d6f86"/></linearGradient>
<radialGradient id="om-sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff6c8"/><stop offset=".6" stop-color="#ffd25e"/><stop offset="1" stop-color="#ffb43a" stop-opacity="0"/></radialGradient>
<linearGradient id="om-land" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9b878"/><stop offset="1" stop-color="#7e8f52"/></linearGradient>
<g id="om-oy"><ellipse rx="6" ry="3.4" fill="#cfc4ae" stroke="#7d7363" stroke-width=".8"/><path d="M-4 -1 Q0 -3 4 -1" stroke="#9b917f" stroke-width=".7" fill="none"/></g>
<g id="om-snail"><ellipse rx="5.4" ry="4.4" fill="#a85a2c" stroke="#5e2c12" stroke-width=".7"/><path d="M-2.4 -.9 a2.4 2.4 0 1 1 2.7 2.4" stroke="#f0b68a" stroke-width=".7" fill="none"/></g>
<g id="om-base">
<rect width="320" height="180" fill="url(#om-sky)"/>
<path d="M0 62 Q60 50 120 64 L175 70 Q140 110 0 120 Z" fill="url(#om-land)"/>
<path d="M0 120 Q120 110 175 70 L320 70 V180 H0 Z" fill="#a3b06c"/>
<g fill="#4c6b3a"><path d="M14 62 l5 -13 l5 13 Z"/><path d="M30 60 l5 -15 l5 15 Z"/><path d="M60 58 l4 -11 l4 11 Z"/><path d="M96 62 l5 -13 l5 13 Z"/></g>
<path d="M300 152 h20 v4 h-20 Z" fill="#7a5a3a"/>
</g>
<g id="om-reef"><ellipse cx="236" cy="132" rx="44" ry="12" fill="#8c8170" opacity=".55"/>
<use href="#om-oy" transform="translate(206 130)"/><use href="#om-oy" transform="translate(218 126)"/><use href="#om-oy" transform="translate(231 129)"/><use href="#om-oy" transform="translate(244 125)"/><use href="#om-oy" transform="translate(257 130)"/><use href="#om-oy" transform="translate(268 127)"/><use href="#om-oy" transform="translate(224 135)"/><use href="#om-oy" transform="translate(239 136)"/><use href="#om-oy" transform="translate(253 136)"/><use href="#om-oy" transform="translate(212 137)"/></g>
<g id="om-gauge"><rect x="292" y="20" width="14" height="60" rx="7" fill="#fff" stroke="#55606a" stroke-width="1.4"/><text x="299" y="92" font-size="8" font-family="Arial, sans-serif" fill="#33404a" text-anchor="middle" font-weight="700">SALT</text></g>
<g id="om-boat"><path d="M268 150 h32 l-5 9 h-22 Z" fill="#e8e2d4" stroke="#6a5f50" stroke-width=".8"/><rect x="276" y="142" width="10" height="8" fill="#d8d0bd" stroke="#6a5f50" stroke-width=".6"/><line x1="300" y1="152" x2="300" y2="138" stroke="#5a412a" stroke-width="2"/></g>
</defs>
<g class="s1">
<use href="#om-base"/>
<circle cx="70" cy="26" r="20" fill="url(#om-sun)"/>
<path d="M0 64 Q40 70 70 80 Q110 92 150 100 Q170 104 190 104 L190 110 Q160 110 140 106 Q100 98 66 86 Q36 76 0 70 Z" fill="#5d8fb0"/>
