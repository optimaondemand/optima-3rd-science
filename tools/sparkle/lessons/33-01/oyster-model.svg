<circle cx="70" cy="26" r="24" fill="url(#om-sun)"/>
<path d="M0 66 Q40 71 70 80 Q110 92 150 99 Q170 102 190 102 L190 104 Q160 105 140 103 Q100 96 66 84 Q36 75 0 69 Z" fill="#6f98b2"/>
