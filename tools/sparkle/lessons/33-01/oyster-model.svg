<circle cx="70" cy="26" r="24" fill="url(#om-sun)"/>
<path d="M0 66 Q40 71 70 80 Q110 92 150 99 Q170 102 190 102 L190 104 Q160 105 140 103 Q100 96 66 84 Q36 75 0 69 Z" fill="#6f98b2"/>
<path d="M175 70 Q160 110 0 120 V180 H320 V70 Z" fill="url(#om-bayS)"/>
<use href="#om-reef"/>
<use href="#om-snail" transform="translate(214 124)"/><use href="#om-snail" transform="translate(236 123)"/><use href="#om-snail" transform="translate(251 128)"/><use href="#om-snail" transform="translate(229 132)"/><use href="#om-snail" transform="translate(262 133)"/><use href="#om-snail" transform="translate(205 134)"/>
<use href="#om-gauge"/><rect x="295" y="28" width="8" height="50" rx="4" fill="#e0703a"/><use href="#om-boat"/>
</g>
<g class="s4">
<use href="#om-base"/>
<circle cx="70" cy="26" r="22" fill="url(#om-sun)"/>
<path d="M0 66 Q40 71 70 80 Q110 92 150 99 Q170 102 190 102 L190 104 Q160 105 140 103 Q100 96 66 84 Q36 75 0 69 Z" fill="#6f98b2"/>
<path d="M175 70 Q160 110 0 120 V180 H320 V70 Z" fill="url(#om-bayS)"/>
<ellipse cx="236" cy="134" rx="34" ry="8" fill="#8c8170" opacity=".45"/>
<use href="#om-oy" transform="translate(228 133)"/><use href="#om-oy" transform="translate(244 134)"/>
<use href="#om-snail" transform="translate(236 130)"/>
<use href="#om-gauge"/><rect x="295" y="28" width="8" height="50" rx="4" fill="#e0703a"/><use href="#om-boat"/>
<g transform="translate(300 118)"><line x1="0" y1="0" x2="0" y2="20" stroke="#5a412a" stroke-width="2"/><rect x="-14" y="-12" width="28" height="14" rx="2" fill="#c0392b" stroke="#7a1f16"/><path d="M-7 -9 l14 8 M7 -9 l-14 8" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></g>
