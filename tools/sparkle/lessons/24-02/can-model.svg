<linearGradient id="bin" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1f5fa8"/><stop offset=".5" stop-color="#3a7fd0"/><stop offset="1" stop-color="#1b4f8c"/></linearGradient>
<linearGradient id="can" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9aa3aa"/><stop offset=".45" stop-color="#eef2f4"/><stop offset="1" stop-color="#7d868d"/></linearGradient>
<linearGradient id="red" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8e1d1d"/><stop offset=".45" stop-color="#d94a3d"/><stop offset="1" stop-color="#7a1919"/></linearGradient>
<linearGradient id="belt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4b4f53"/><stop offset="1" stop-color="#2c2f32"/></linearGradient>
<radialGradient id="melt" cx=".5" cy=".4" r=".6"><stop offset="0" stop-color="#fff3b0"/><stop offset=".5" stop-color="#ffb347"/><stop offset="1" stop-color="#d9531e"/></radialGradient>
<linearGradient id="pot" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3b3b3b"/><stop offset=".5" stop-color="#6a6a6a"/><stop offset="1" stop-color="#2e2e2e"/></linearGradient>
</defs>
