<svg viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A model: an empty can goes into a blue recycling bin; a belt and a magnet sort the cans; a press squashes them into a bale; the metal melts in a hot pot and becomes a shiny new can">
