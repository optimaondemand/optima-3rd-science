<path d="M62 50 Q66 44 82 46 Q92 48 96 52 Z" fill="#e9d4a6"/>
<path d="M78 54 C120 70 170 96 210 112 S250 128 268 128" stroke="#3b2a1c" stroke-width="18" stroke-linecap="round" fill="none"/>
<path d="M78 54 C120 70 170 96 210 112 S250 128 268 128" stroke="#5a412a" stroke-width="12" stroke-linecap="round" fill="none"/>
</g>
</defs>
<g class="s1">
