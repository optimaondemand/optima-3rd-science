<g fill="#ff7a2a"><circle cx="30" cy="51" r="1.6"/><circle cx="60" cy="52" r="1.3"/><circle cx="96" cy="51" r="1.5"/><circle cx="150" cy="52" r="1.2"/><circle cx="230" cy="51" r="1.6"/></g>
