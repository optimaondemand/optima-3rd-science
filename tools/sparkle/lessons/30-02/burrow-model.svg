<svg viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A model of a gopher tortoise burrow during a scrub fire: fire comes toward the burrow; the tortoise and a gopher frog go to the deep end of the burrow; the fire passes over the ground while the deep burrow stays cool; afterward the tortoise and the frog come out and new green sprouts grow">
<defs>
<linearGradient id="bm-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8cc4e8"/><stop offset="1" stop-color="#e6f2fa"/></linearGradient>
<linearGradient id="bm-haze" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9a08a"/><stop offset="1" stop-color="#f1d6b0"/></linearGradient>
<linearGradient id="bm-smoke" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6d6461"/><stop offset="1" stop-color="#b3a497"/></linearGradient>
<linearGradient id="bm-sand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9d4a6"/><stop offset=".55" stop-color="#cdae78"/><stop offset="1" stop-color="#a98657"/></linearGradient>
<g id="bm-tort"><path d="M-12 0 Q-11 -11 0 -11 Q11 -11 12 0 Z" fill="#7a5a33" stroke="#4a361d" stroke-width="1"/><path d="M-6 -9 L-3 -2 M3 -10 L2 -2 M8 -6 L6 -1" stroke="#4a361d" stroke-width=".8"/><ellipse cx="14" cy="-2" rx="4" ry="3" fill="#6b5b45"/><rect x="-10" y="-1" width="5" height="4" rx="1.5" fill="#6b5b45"/><rect x="5" y="-1" width="6" height="4" rx="1.5" fill="#6b5b45"/></g>
<g id="bm-frog"><ellipse cx="0" cy="0" rx="6" ry="4" fill="#9a7b4f"/><circle cx="3" cy="-3" r="1.6" fill="#3b2a1c"/><circle cx="-1" cy="-3.2" r="1.4" fill="#3b2a1c"/><path d="M-5 2 l-4 3 M4 3 l4 2" stroke="#7a5d36" stroke-width="1.6" stroke-linecap="round"/></g>
<g id="bm-flame"><path d="M0 0 Q-9 -10 -3 -20 Q-2 -13 2 -12 Q0 -24 8 -32 Q7 -20 12 -14 Q15 -8 10 0 Z" fill="#f08a24"/><path d="M2 0 Q-2 -7 2 -13 Q4 -8 7 -7 Q9 -3 7 0 Z" fill="#ffd34d"/></g>
<g id="bm-grass" stroke="#5d8a3a" stroke-width="1.6" stroke-linecap="round" fill="none"><path d="M0 0 l-3 -9 M0 0 l1 -11 M0 0 l4 -8"/></g>
<g id="bm-burnt" stroke="#2b2420" stroke-width="1.6" stroke-linecap="round" fill="none"><path d="M0 0 l-2 -6 M0 0 l1 -7"/></g>
<g id="bm-ground">
