<g stroke="#4fae3a" stroke-width="1.8" stroke-linecap="round" fill="none"><path d="M120 50 l-2 -7 M120 50 l2 -8"/><path d="M180 50 l-2 -6 M180 50 l3 -7"/><path d="M210 50 l-1 -8 M210 50 l3 -6"/><path d="M280 50 l-2 -7 M280 50 l2 -8"/><path d="M30 50 l-2 -6 M30 50 l2 -7"/></g>
