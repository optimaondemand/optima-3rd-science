 <g fill="#2d4a3a"><circle cx="40" cy="146" r="11"/><circle cx="72" cy="150" r="12"/><circle cx="248" cy="150" r="12"/><circle cx="280" cy="146" r="11"/></g>
 <text x="160" y="26" text-anchor="middle" font-family="Georgia,serif" font-size="15" font-weight="700" fill="#1b3a2a">4 · Share it with visitors</text>
