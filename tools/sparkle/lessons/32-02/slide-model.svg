  <circle cx="266" cy="96" r="20" fill="#9a9aa2"/><text x="266" y="100">wolf</text></g>
 <path d="M66 96 h26" stroke="#7a5520" stroke-width="3" marker-end="url(#sm-ar)"/><path d="M140 96 h26" stroke="#7a5520" stroke-width="3" marker-end="url(#sm-ar)"/><path d="M214 96 h26" stroke="#7a5520" stroke-width="3" marker-end="url(#sm-ar)"/>
 <text x="160" y="140" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-style="italic" fill="#3a4a3e">Arrows show where the energy goes.</text>
