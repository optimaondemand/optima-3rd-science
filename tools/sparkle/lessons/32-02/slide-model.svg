  <text x="12" y="64">2</text><text x="62" y="64">22</text><text x="132" y="64">24 cm</text>
  <text x="12" y="82">3</text><text x="62" y="82">31</text><text x="132" y="82">18 cm</text></g>
  <path d="M8 32 h164 M54 16 v76 M124 16 v76" stroke="#c9b98f"/></g>
 <g transform="translate(36 150) rotate(-90)"><rect width="100" height="12" fill="#e3b04b" stroke="#9c7a2a"/><path d="M10 0 v5 M20 0 v7 M30 0 v5 M40 0 v7 M50 0 v5 M60 0 v7 M70 0 v5 M80 0 v7 M90 0 v5" stroke="#5a3a1f"/></g>
 <text x="160" y="26" text-anchor="middle" font-family="Georgia,serif" font-size="15" font-weight="700" fill="#1b3a2a">2 · Collect evidence</text>
</g>
<g class="s3" style="opacity:0">
 <g font-family="Arial,sans-serif" font-size="9" font-weight="700" text-anchor="middle" fill="#1b3a2a">
