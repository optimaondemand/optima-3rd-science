<svg viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A model of how park science gets shared: a scientist's notepad of observations, a data sheet of measurements, a food web model, and a slide shown to visitors">
<defs>
<linearGradient id="sm-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe3d6"/><stop offset="1" stop-color="#eef4ea"/></linearGradient>
<marker id="sm-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#7a5520"/></marker>
</defs>
<rect width="320" height="180" fill="url(#sm-bg)"/>
<rect y="150" width="320" height="30" fill="#b48a5a"/><rect y="150" width="320" height="4" fill="#8a6640"/>
