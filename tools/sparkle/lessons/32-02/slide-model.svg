  <path d="M38 30 h44 M38 40 h38 M12 54 h70 M12 64 h56" stroke="#7a6a50" stroke-width="2" stroke-linecap="round"/></g>
 <text x="160" y="26" text-anchor="middle" font-family="Georgia,serif" font-size="15" font-weight="700" fill="#1b3a2a">1 · Observe</text>
</g>
<g class="s2" style="opacity:0">
 <g transform="translate(70 40)"><rect width="180" height="104" rx="6" fill="#fffdf4" stroke="#9c8a62"/><rect x="74" y="-8" width="32" height="14" rx="3" fill="#8a6640"/>
  <g font-family="Arial,sans-serif" font-size="10" fill="#2b1d12"><text x="12" y="26" font-weight="700">Day</text><text x="62" y="26" font-weight="700">Birds seen</text><text x="132" y="26" font-weight="700">Water</text>
