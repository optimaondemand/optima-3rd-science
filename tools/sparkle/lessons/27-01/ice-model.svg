<svg viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A model of an ice cube's day: ice cubes in a freezer tray; an ice cube melting on a plate in a sunny kitchen; a puddle of water on the plate; the plate dry while invisible water vapor rises into the air">
