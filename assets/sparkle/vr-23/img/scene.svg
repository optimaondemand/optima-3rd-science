<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe0f5"/><stop offset="1" stop-color="#eef6fa"/></linearGradient>
<linearGradient id="grass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8cc66a"/><stop offset="1" stop-color="#5fa04a"/></linearGradient>
<linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fb7e6"/><stop offset="1" stop-color="#3f86c2"/></linearGradient>
<linearGradient id="wall" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9aa1a8"/><stop offset="1" stop-color="#737a82"/></linearGradient>
<radialGradient id="puff" cx=".4" cy=".4" r=".6"><stop offset="0" stop-color="#8d8d8d"/><stop offset="1" stop-color="#5b5b5b"/></radialGradient></defs>
<rect width="800" height="450" fill="url(#sky)"/>
<circle cx="690" cy="62" r="30" fill="#ffe58a"/>
<ellipse cx="250" cy="250" rx="330" ry="80" fill="#a9d48b"/><ellipse cx="640" cy="255" rx="300" ry="70" fill="#9ccb80"/>
