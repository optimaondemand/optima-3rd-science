<circle cx="468" cy="280" r="9" fill="#222"/><circle cx="524" cy="280" r="9" fill="#222"/><circle cx="468" cy="280" r="4" fill="#bbb"/><circle cx="524" cy="280" r="4" fill="#bbb"/></g>
<!-- stream and lake -->
<path d="M0 345 Q150 325 300 350 T560 372 Q640 380 800 362 L800 450 L0 450 Z" fill="url(#water)"/>
